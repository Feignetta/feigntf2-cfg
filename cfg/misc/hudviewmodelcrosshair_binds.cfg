//inspired from lenny's autoexec, tweaked some stuff and added crosshair color switching

alias black "cl_crosshair_blue 0; cl_crosshair_green 0; cl_crosshair_red 0"
alias white "cl_crosshair_blue 255; cl_crosshair_green 255; cl_crosshair_red 255"
alias green "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0"
alias blue "cl_crosshair_blue 255; cl_crosshair_green 255; cl_crosshair_red 0"
alias pink "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255"
alias yellow "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 255"
alias yellowcycle "yellow; bind ins greencycle"
alias greencycle "green; bind ins whitecycle"
alias whitecycle "white; bind ins yellowcycle"

bind del "incrementvar cl_crosshair_scale 36 56 4"
bind pgup "incrementvar viewmodel_fov 80 100 5"
bind pgdn "incrementvar tf_use_min_viewmodels 0 1 1"
bind end "incrementvar r_drawviewmodel 0 1 1"
bind ins yellowcycle

echo "hud viewmodel crosshair binds active"
echo "DEL = CROSSHAIR SCALE"
echo "PGUP = VIEWMODEL FOV"
echo "PGDN = TOGGLE VIEWMODEL MINMODE"
echo "INS = CYCLE CROSSHAIR COLORS : YELLOW GREEN WHITE"