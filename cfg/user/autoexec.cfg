
exec user/custom.cfg


//yttrium comp vmodels
mod_load_anims_async 0
mod_load_mesh_async 0
mod_load_vcollide_async 0

// SOUND
snd_surround_speakers [0/2/4/5/7] // 0 for built-in Miles3D headphone sound, 2/4/5/7 for speakers setup (select appropriate # of speakers), 7 for using Razer Surround Sound for headphones (installer is included in this pack)
dsp_enhance_stereo [0/1] // "0" for software headphones surround, "1" for snd_surround_speakers 0 (normal headphone setting)
snd_spatialize_roundrobin 0 // keep at 0 for better surround sound placement/accuracy
snd_mixahead .06 // Sound delay/buffer. Increase if you the beginning of sounds are cut out .05 has been known to be unstable
dsp_water 0 // removes "underwatery" sound
snd_pitchquality 1 // no reason to use 0, makes sound horrible at nill FPS increase
bind j "snd_restart" // fixes looping sounds (great for shutting the cart up)
 
// HIT SOUND--my settings (tweak as you like)           
tf_dingalingaling "1"
tf_dingaling_pitchmaxdmg "50"    //lower pitch for high damage
tf_dingaling_pitchmindmg "150"   //higher pitch for less damage

cl_smooth 0 
mod_load_anims_async 0 // Disable async animation loading
mod_load_mesh_async 0 // Disable async mesh loading
mod_load_vcollide_async 0 // Disable async vcollide loading

m_filter 0 // Do not average mouse input over two frames, more responsive mouse input
m_mousespeed 0 // Disable Windows mouse acceleration (-noforcemspd)
m_mouseaccel1 0 // ^ (-noforcemaccel)
m_mouseaccel2 0 // ^ (-noforcemaccel)
m_rawinput 1 // Use raw input from mouse
zoom_sensitivity_ratio 0.7934714 // Use same sensitivity as when unscoped

fov_desired 90
cl_autoreload 1

cl_timeout 999
tf_steam_workshop_query_timeout 5 

alias download_all "cl_downloadfilter all"
alias download_nosounds "cl_downloadfilter nosounds"
alias download_mapsonly "cl_downloadfilter mapsonly"
alias download_none "cl_downloadfilter none"
alias download download_all

tf_mm_debug_level 0 
tf_party_join_request_mode 1 
sv_parallel_sendsnapshot 1
r_threaded_particles 1 
mat_queue_mode 2 
mat_max_worldmesh_vertices 65536 


sv_cheats 1
map_background preload_room; wait 10; disconnect; con_filter_enable 0


// Prism Settings (for refract)

mat_motion_blur_enabled 1 			//afaik the only sure-fire way to keep refract masking on
mat_motion_blur_strength 0 			//effectively disables motion blur, personal choice + motion blur gets masked and looks bad with refract masking
mat_disable_bloom 1 				//disables bloom so refract masking doesn't create a dark rectangle over light materials
mat_hdr_level 0
mat_colcorrection_disableentities 1
mat_colorcorrection 0

bindtoggle p " cl_hud_playerclass_use_playermodel"

prec_mode 3
bind F4 "prec_mark"

tf_time_loading_item_panels 0.0005


xhairflasher

//Spy Scripts

viewmodel_fov 95


//Ambassador Zoom Script
alias "+ambyzoom" "fov_desired 75; viewmodel_fov 90; viewmodel_fov_demo 90; sensitivity 2.1964"
alias "-ambyzoom" "fov_desired 95; viewmodel_fov 90; viewmodel_fov_demo 90; sensitivity 2.1964"
bind "mouse4" "+ambyzoom"

 // Stabby's Viewmodel Script for Spy //

    // // // // // // // // // // //  // // // // // // // // // // // //  //
    //Viewmodels<< on when shooting amby, off when knife or watch out//
    // // // // // // // // // // //  // // // // // // // // // // // //  //


    // spawn with knife out and viewmodel mode set to "on"

    slot3
    r_drawviewmodel 1
    knife_vm_mode


    // replace [KEY] with the your Keybinds for the sapper/knife/ambassador/watch

    bind "KEY" +equip_sap         // 2/button for sapper
    bind "KEY" +equip_knife      // Key/button for knife
    bind "KEY" +equip_amby      // Key/button for ambassador
    bind "KEY" "+watch;spec_prev"          // Key for watch (mouse2 default)


    //re-bind mouse1

    alias knife_vm_mode "bind mouse1 +viewmodel_knife" // binds mouse1 to turn viewmodel on when attacking (for knife knife)
    alias amby_vm_mode "bind mouse1 +viewmodel_amby"  // binds mouse1 to turn viewmodel off when attacking (for amby)
    alias sap_vm_mode "bind mouse1 +viewmodel_sap"   // binds mouse 1 to turn viewmodel on when attacking and off when not (for sapper)


    // causes viewmodel to go off or on when you shoot

    alias +viewmodel_knife "+attack;r_drawviewmodel 1;spec_next"          // attacks, turns viewmodel on
    alias -viewmodel_knife "-attack;r_drawviewmodel 1"         // finishes atack, turns viewmodel on again as safeguard

    alias +viewmodel_amby "+attack;r_drawviewmodel 0;spec_next"          // attacks, turns viewmodel off
    alias -viewmodel_amby "-attack;r_drawviewmodel 0"         // finishes attack, turns viewmodel off again as a safeguard

    alias +viewmodel_sap "+attack;r_drawviewmodel 1;spec_next"          // shows sapper when sapping
    alias -viewmodel_sap "-attack;r_drawviewmodel 0"         // hides sapper when mouse1 released


    // Equip item, turn vm on/off, set vm toggle for attack

    alias +equip_knife "slot3;r_drawviewmodel 1"             // Equips knife, turns viewmodels on
    alias -equip_knife "knife_vm_mode;r_drawviewmodel 1"    // Sets viewmodels to turn ON when stabbing (makes sure it stays on)

    alias +equip_amby "slot1"                               // Equips amby
    alias -equip_amby "amby_vm_mode"                        // Sets viewmodels to turn OFF when shooting

    alias +equip_sap "slot2;r_drawviewmodel 1"             // Equips sapper, turns viewmodels on
    alias -equip_sap "sap_vm_mode"                        // Sets viewmodels to turn on while firing, and off when not

    alias +watch "+attack2;r_drawviewmodel 1"              // watch up/cloak on/secondary attack + viewmodels on
    alias -watch "-attack2;r_drawviewmodel 1"             // viewmodels on again as safeguard



prec_mode 3
bind F4 "prec_mark"

    bind "N" "disguise 8 -2"

bind mouse5 " +duck 1; -duck 1; +jump 1; -jump 1; wait 5; +attack 1; -attack 1"

xhairflasher

voice_enable 1
bind "v" "+voicerecord"

    // // // // // // // // // // //  //


    echo "Viewmodel script loaded" // confirms script loaded in the console
